function calendar(){let s=stats(),q=window.taskQuery||'',f=window.taskFilter||'Todos';$('calendar').innerHTML=heading('calendar','Plan de los primeros 15 días','Cada actividad tiene pasos, estado, responsable, coste estimado y fecha editable.')+`<div class="card"><div class="topbar"><b>Avance ${s.done}/${s.total} · ${s.pct}%</b><button class="btn" onclick="edit('tasks')">+ Nueva tarea</button></div><div class="progress" style="margin:12px 0"><span style="width:${s.pct}%"></span></div><div class="toolbar"><input style="max-width:320px" placeholder="Buscar tarea..." value="${esc(q)}" oninput="window.taskQuery=this.value;calendar()"><select style="max-width:190px" onchange="window.taskFilter=this.value;calendar()">${['Todos','Pendiente','En curso','Completada'].map(v=>`<option ${f===v?'selected':''}>${v}</option>`).join('')}</select></div>${Array.from({length:15},(_,i)=>i+1).map(d=>{let arr=db.tasks.filter(t=>num(t.day)===d&&t.title.toLowerCase().includes(q.toLowerCase())&&(f==='Todos'||t.status===f));return `<div class="day"><div class="dayhead"><h3>Día ${d} <span class="small">${d<=3?'Organización e identidad':d<=6?'Diseño de camisetas':d<=10?'Proveedores y costes':d<=13?'Validación y marketing':'Revisión y decisión'}</span></h3><span class="small">${arr.length} tareas</span></div>${arr.map(t=>`<div class="task"><div class="inline"><input aria-label="Marcar completada" type="checkbox" ${t.status==='Completada'?'checked':''} onchange="setTask('${t.id}',this.checked)"><div><strong>${esc(t.title)}</strong><span class="small">${esc(t.description)} · ${owner(t.owner)} · ${dateES(t.due)} · ${eur(t.cost)} · ${esc(t.priority)}</span><details><summary>Instrucciones y notas</summary><p>${esc(t.steps)}</p><p>${esc(t.notes||'Sin notas')}</p><p>Colaboradores: ${esc(t.collab||'No asignados')}</p></details></div></div><div class="actions">${pill(t.status)}${btns('tasks',t.id)}</div></div>`).join('')||'<div class="small">No hay tareas con este filtro.</div>'}</div>`}).join('')}</div><div class="card"><h3>Informe automático</h3><p>${s.done} completadas · ${s.active} en curso · ${s.pending} pendientes. Coste estimado de tareas: ${eur(db.tasks.reduce((a,x)=>a+num(x.cost),0))} (orientativo, NO contabilizado como gasto).</p><button class="btn alt" onclick="nav('review')">Ver condiciones antes de producir</button></div>`}
function creative(){let approved=db.designs.filter(x=>x.status==='Aprobado').length;$('creative').innerHTML=heading('creative','Diseño y creatividad','De la idea al mockup; usar Canva y validar antes de imprimir.')+`<div class="grid">${summaryCard('Propuestas',db.designs.length)}${summaryCard('Aprobados',approved)}${summaryCard('Responsable',owner(db.settings.creativeOwner))}</div><div class="card"><div class="topbar"><h3>Registro de diseños</h3><button class="btn" onclick="edit('designs')">+ Añadir diseño</button></div>${rows('designs',[['name','Diseño'],['code','Referencia'],['shirt','Camiseta'],['placement','Estampado'],['status','Estado'],['canva','Canva',v=>safeLink(v)],['mockup','Mockup',v=>safeLink(v)],['cost','Coste estimado',eur],['comments','Notas'],['updated','Actualizado',dateES]])}</div><div class="card"><h3>Checklist de calidad</h3>${checks('design',['Coherencia con el público y estilo de Golden Century','Logo y tipografías legibles','Mockup delantero y trasero revisados','Dimensiones y resolución verificadas con imprenta','Colores y ubicaciones definidos','Archivos y enlace Canva compartidos'])}</div><div class="card"><h3>Objetivos del área</h3><p>Preparar 2–3 conceptos, obtener opiniones y seleccionar uno sin gastar en grandes tiradas. Herramientas: Canva, carpeta compartida y mockups. Tareas creativas pendientes: ${db.tasks.filter(x=>x.day>=3&&x.day<=6&&x.status!=='Completada').length}.</p><label class="small">Notas de creatividad</label><textarea oninput="setting('contentNotes',this.value)">${esc(db.settings.contentNotes)}</textarea></div>`}
function safeLink(v){if(!v)return '<span class="small">Pendiente</span>';try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?`<a class="link" href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`:'Enlace inválido'}catch{return 'Enlace inválido'}}
function supplierCharts(){
 const quantities=[5,10,15],total=30;
 const segments=quantities.map((n,i)=>({label:n+' camisetas',n,color:['#c5a264','#292724','#d8c9b0'][i]}));
 const gradient='conic-gradient('+segments.map((v,i)=>{let a=quantities.slice(0,i).reduce((x,y)=>x+y,0)/total*100;return `${v.color} ${a}% ${a+v.n/total*100}%`}).join(',')+')';
 const known=db.providers.map(p=>({name:p.name,qty:Number(p.minimum)})).filter(p=>Number.isFinite(p.qty)&&p.qty>0);
 const quantityText=known.length?known.map(p=>`<div class="legendrow"><b>${esc(p.name)}:</b> mínimo indicado ${p.qty} uds. (verificar con proveedor)</div>`).join(''):'<p class="small">Aún no hay cantidades mínimas numéricas registradas. Introducidlas en la tabla cuando el proveedor las confirme.</p>';
 return `<div class="card"><h3>Distribución visual de cantidades</h3><p class="small">Comparativa de escenarios de estudio, no pedidos realizados ni existencias compradas.</p><div class="chartgrid"><div><div class="donut" role="img" aria-label="Escenarios: 5, 10 y 15 camisetas" style="background:${gradient}"><div class="donutcenter">30<small>uds. comparadas</small></div></div></div><div class="legend">${segments.map(v=>`<div class="legendrow"><span class="legenddot" style="background:${v.color}"></span>${v.label} · ${(v.n/total*100).toFixed(1).replace('.',',')}%</div>`).join('')}<p class="small">Son tres escenarios independientes; no se propone comprar 30 camisetas.</p></div></div><h3 style="margin-top:18px">Cantidades mínimas de proveedores</h3>${quantityText}</div>`;
}
function providers(){let q=window.providerQuery||'';$('providers').innerHTML=heading('providers','Proveedores y estampación','Candidatos iniciales. Precios, mínimos y condiciones: pendientes de confirmar directamente.')+supplierCharts()+`<div class="alert">No se han verificado en tiempo real los precios ni las condiciones comerciales. Los campos vacíos significan «Pendiente de confirmar». BigBuy es un distribuidor: comprobad si sirve realmente para este caso; «Fun Fashion» requiere verificar identidad y web oficial.</div><div class="card"><div class="topbar"><h3>Comparativa editable</h3><button class="btn" onclick="edit('providers')">+ Proveedor</button></div><div class="toolbar"><input placeholder="Buscar proveedor" style="max-width:310px" value="${esc(q)}" oninput="window.providerQuery=this.value;providers()"></div><div class="tablewrap"><table class="table"><thead><tr>${['Empresa','Web','Ubicación','Servicio / camiseta','Estampación','Mínimo','Base','Impresión','Transporte','Muestra','Total unitario','Plazo','Consulta','Contacto','Observaciones','Acciones'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${db.providers.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${safeLink(x.url)}</td><td>${esc(x.location||'Pendiente de confirmar')}</td><td>${esc(x.service||'Pendiente de confirmar')}<br><small>${esc(x.shirt||'Pendiente de confirmar')}</small></td><td>${esc(x.printing||'Pendiente de confirmar')}</td><td>${esc(x.minimum||'Pendiente de confirmar')}</td>${['base','print','shipping','sample'].map(k=>`<td>${x[k]===''?'Pendiente de confirmar':eur(x[k])}</td>`).join('')}<td>${x.base!==''&&x.print!==''&&x.shipping!==''?eur(num(x.base)+num(x.print)+num(x.shipping)/Math.max(1,num(x.minimum)||1)):'Pendiente de confirmar'}</td><td>${esc(x.lead||'Pendiente de confirmar')}</td><td>${dateES(x.checked)}</td><td>${esc(x.contact)}</td><td>${esc(x.notes)}</td><td>${btns('providers',x.id)}</td></tr>`).join('')}</tbody></table></div><p class="small">El total unitario solo se calcula cuando existen datos; reparte transporte entre unidades según mínimo registrado, a título orientativo. El coste de muestra se gestiona aparte.</p></div><div class="card"><h3>Opciones de estampación</h3>${[['DTF','Transfer de diseño impreso sobre film y aplicado con calor.','Versátil para colores y tiradas cortas.','El tacto y la durabilidad dependen de materiales y aplicación.','¿Precio por tamaño, lavado y número de posiciones?'],['DTG','Tinta impresa directamente sobre la prenda.','Adecuado para diseños complejos y pocas unidades.','Depende de tejido, pretratamiento y equipo.','¿Qué composición y colores de prenda admitís?'],['Serigrafía','Tinta aplicada mediante pantallas por color.','Suele mejorar su coste unitario al aumentar unidades.','Preparación inicial por pantalla y color.','¿Coste de pantalla y mínimo por diseño?'],['Vinilo textil','Material recortado y aplicado con calor.','Útil para textos y diseños sencillos en tiradas pequeñas.','Menos práctico para detalles complejos o muchos colores.','¿Durabilidad, tacto y límites de detalle?']].map(([name,what,pros,cons,ask])=>`<details><summary>${name}</summary><p><b>Qué es:</b> ${what}<br><b>Ventaja:</b> ${pros}<br><b>Limitación:</b> ${cons}<br><b>Preguntar:</b> ${ask}</p></details>`).join('')}<p>La elección depende de diseño, tejido, cantidad y presupuesto. Solicitad presupuestos comparables.</p></div><div class="card"><h3>Mensaje para solicitar presupuestos</h3><textarea id="supplierMessage" oninput="setting('message',this.value)">${esc(db.settings.message)}</textarea><div class="toolbar"><button class="btn" onclick="copyMessage()">Copiar mensaje</button><button class="btn alt" onclick="edit('contacts')">+ Registrar contacto</button></div>${rows('contacts',[['date','Fecha',dateES],['provider','Proveedor'],['person','Contacto'],['response','Respuesta'],['next','Siguiente paso']])}</div>`}
async function copyMessage(){let val=$('supplierMessage').value;try{await navigator.clipboard.writeText(val);alert('Mensaje copiado')}catch{let t=$('supplierMessage');t.select();document.execCommand('copy');alert('Mensaje seleccionado: copia con Ctrl+C si es necesario')}}
function setting(k,v){db.settings[k]=v;try{localStorage.setItem(STORE,JSON.stringify(db))}catch{}}
function finance(){let s=stats();$('finance').innerHTML=heading('finance','Presupuesto y contabilidad','Nunca confundáis una reserva o una estimación con dinero realmente pagado.')+`<div class="grid">${summaryCard('Límite inicial',eur(db.settings.budget))}${summaryCard('Pagado',eur(s.paid),'Gastos reales registrados')}${summaryCard('Previsto',eur(s.planned),'Aún no pagado')}${summaryCard('Disponible tras reservas',eur(s.available),'Saldo sin comprometer')}</div>${s.paid+s.planned>num(db.settings.budget)?'<div class="alert">⚠ El total previsto y pagado supera el presupuesto autorizado.</div>':''}<div class="card"><div class="topbar"><h3>Registro de gastos</h3><button class="btn" onclick="edit('expenses')">+ Registrar gasto</button></div>${rows('expenses',[['description','Concepto'],['category','Categoría'],['amount','Importe',eur],['date','Fecha',dateES],['status','Estado'],['owner','Responsable',owner],['supplier','Proveedor'],['notes','Notas']])}</div><div class="card"><h3>Escenarios de producción · 5 / 10 / 15 camisetas</h3><p>Introduce precios de referencia. El transporte es total del pedido, NO por unidad. No se registra como gasto automáticamente.</p><div class="formgrid">${[['Camiseta base / ud.','base'],['Estampación / ud.','print'],['Transporte total pedido','shipping'],['Embalaje / ud.','pack'],['Otros variables / ud.','other']].map(([label,key],i)=>`<div class="field"><label>${label} (€)</label><input type="number" min="0" step="0.01" value="${esc(db.settings.scenarioInputs[i]??'')}" oninput="db.settings.scenarioInputs[${i}]=this.value;setting('scenarioInputs',db.settings.scenarioInputs);updateScenarios()"></div>`).join('')}</div><div id="scenarios" class="tablewrap"></div><p class="small">Cifras provisionales hasta recibir presupuestos. Para decidir precio de venta considerad también impuestos, comisiones y otros gastos.</p></div>`;updateScenarios()}
function updateScenarios(){let v=db.settings.scenarioInputs,valid=v.every(x=>x!==null&&x!==''&&Number.isFinite(Number(x)));$('scenarios').innerHTML=valid?`<table class="table"><thead><tr><th>Unidades</th><th>Coste total estimado</th><th>Coste unitario</th><th>Margen disponible respecto a 150 €</th></tr></thead><tbody>${[5,10,15].map(n=>{let total=n*(num(v[0])+num(v[1])+num(v[3])+num(v[4]))+num(v[2]);return `<tr><td>${n}</td><td>${eur(total)}</td><td>${eur(total/n)}</td><td>${eur(num(db.settings.budget)-total)}</td></tr>`}).join('')}</tbody></table>`:'<p>Introduce todos los costes para calcular escenarios (puedes usar 0 cuando esté confirmado).</p>'}
function pricing(){let v=db.settings.priceInputs;$('pricing').innerHTML=heading('pricing','Simulador de precio de venta','Comparad opciones sin fijar todavía un precio definitivo.')+`<div class="card"><div class="formgrid">${['Camiseta base / ud.','Estampación / ud.','Transporte / ud.','Embalaje / ud.','Otros costes variables / ud.','Precio de venta provisional'].map((x,i)=>`<div class="field"><label>${x} (€)</label><input type="number" min="0" step="0.01" value="${esc(v[i]??'')}" oninput="db.settings.priceInputs[${i}]=this.value;setting('priceInputs',db.settings.priceInputs);updatePrice()"></div>`).join('')}</div><div id="priceResult"></div></div><div class="card"><h3>Conceptos básicos</h3><p><b>Facturación:</b> precio de venta × unidades vendidas. <b>Margen bruto sobre coste variable:</b> diferencia entre precio y coste variable, expresada sobre el precio. <b>Beneficio neto:</b> lo que queda después de todos los gastos e impuestos aplicables; esta simulación NO lo calcula.</p><p>No fijéis precio definitivo hasta confirmar costes, impuestos, comisiones y devoluciones.</p></div>`;updatePrice()}
function updatePrice(){let v=db.settings.priceInputs;if(v.some(x=>x===null||x==='')){$('priceResult').innerHTML='<p>Completa los seis valores para simular el margen.</p>';return}let c=v.slice(0,5).reduce((s,x)=>s+num(x),0),p=num(v[5]);$('priceResult').innerHTML=`<div class="grid" style="margin-top:18px">${summaryCard('Coste variable',eur(c))}${summaryCard('Diferencia por unidad',eur(p-c))}${summaryCard('Margen sobre venta',p?((p-c)/p*100).toFixed(1)+'%':'No definido')}</div><h3>Comparación de precios</h3><div class="tablewrap"><table class="table"><thead><tr><th>Precio</th><th>Margen / ud.</th><th>5 ventas</th><th>10 ventas</th><th>15 ventas</th></tr></thead><tbody>${[p-2,p,p+2,p+5].filter(x=>x>0).map(x=>`<tr><td>${eur(x)}</td><td>${eur(x-c)}</td>${[5,10,15].map(n=>`<td>${eur(n*(x-c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">Resultados antes de costes fijos, impuestos y comisiones. No equivalen a beneficio neto.</p>`}
function team(){let s=db.settings;$('team').innerHTML=heading('team','Equipo y responsabilidades','Tres personas, tres áreas principales; asignaciones editables en cada tarea.')+`<div class="grid">${db.team.map((p,i)=>`<div class="card"><div class="eyebrow">Persona ${i+1}</div><div class="field"><label>Nombre</label><input value="${esc(p.name)}" onchange="db.team[${i}].name=this.value;save()"></div><div class="field"><label>Rol principal</label><input value="${esc(p.role)}" onchange="db.team[${i}].role=this.value;save()"></div><div class="field"><label>Responsabilidades</label><textarea onchange="db.team[${i}].responsibilities=this.value;save()">${esc(p.responsibilities)}</textarea></div><div class="field"><label>Notas</label><textarea onchange="db.team[${i}].notes=this.value;save()">${esc(p.notes)}</textarea></div><p class="small">Tareas principales asignadas: ${db.tasks.filter(x=>String(x.owner)===String(i)).length}</p></div>`).join('')}</div><div class="card"><h3>Matriz de responsabilidades</h3>${rows('tasks',[['title','Tarea'],['day','Día'],['owner','Responsable',owner],['collab','Colaboradores'],['status','Estado']])}</div><div class="alert">Tareas sin responsable: <b>${db.tasks.filter(x=>x.owner==='').length}</b>. Repartidlas en la primera reunión. Para colaboradores, anotad sus nombres en cada tarea.</div><button class="btn" onclick="nav('meetings')">Acuerdos y aprobaciones →</button>`}
function marketing(){$('marketing').innerHTML=heading('marketing','Marketing inicial','Preparad presencia digital sin invertir en anuncios durante estos 15 días.')+`<div class="split"><div class="card"><h3>Instagram</h3>${settingsField('instagram','Usuario / nombre')}${settingsField('igbio','Descripción / bio','textarea')}</div><div class="card"><h3>TikTok</h3>${settingsField('tiktok','Usuario / nombre')}${settingsField('ttbio','Descripción / bio','textarea')}</div></div><div class="card"><h3>Calendario de contenidos y publicaciones</h3><div class="topbar"><p>Ideas: bocetos (día 3), mockups (día 6), encuesta (día 11), proceso creativo (día 13), recapitulación (día 15).</p><button class="btn" onclick="edit('posts')">+ Publicación</button></div>${rows('posts',[['date','Fecha',dateES],['channel','Canal'],['idea','Contenido'],['status','Estado'],['result','Resultados']])}</div><div class="card"><h3>Material a preparar</h3>${checks('marketing',['Fotos de las prendas base y texturas','Mockups de pecho y espalda','Vídeo del proceso de diseño','Plantilla de publicación en Canva','Concepto de póster y enlace QR','Encuesta sobre diseño y precio'])}${settingsField('poster','Concepto de póster','textarea')}${settingsField('qr','Enlace previsto para el QR','url')}<p>Probád primero pocos pósteres y colocadlos solo en espacios autorizados. La publicidad pagada puede esperar a una fase posterior.</p></div>`}
function settingsField(key,label,type='text'){let v=db.settings[key]??'';return `<div class="field" style="margin-bottom:12px"><label>${label}</label>${type==='textarea'?`<textarea onchange="setting('${key}',this.value)">${esc(v)}</textarea>`:`<input type="${type}" value="${esc(v)}" onchange="setting('${key}',this.value)">`}</div>`}
function meetings(){$('meetings').innerHTML=heading('meetings','Reuniones y decisiones','Documentad lo acordado, responsables, seguimiento y bloqueos.')+`<div class="card"><div class="topbar"><h3>Actas de reuniones</h3><button class="btn" onclick="edit('meetings')">+ Reunión</button></div><p class="small">Puedes editar o eliminar cada reunión desde la columna Acciones. Al eliminar se pedirá confirmación.</p>${rows('meetings',[['date','Fecha',dateES],['participants','Participantes'],['topics','Temas'],['decisions','Decisiones'],['actions','Tareas'],['owner','Responsable',owner],['follow','Seguimiento',dateES]])}</div><div class="card"><div class="topbar"><h3>Decisiones, bloqueos y gastos por aprobar</h3><button class="btn" onclick="edit('decisions')">+ Registrar</button></div>${rows('decisions',[['date','Fecha',dateES],['topic','Asunto'],['type','Tipo'],['owner','Responsable',owner],['follow','Seguimiento',dateES],['notes','Detalles']])}</div>`}
function checks(prefix,items){return items.map((x,i)=>`<label class="inline" style="padding:7px 0"><input type="checkbox" ${db.checklist[prefix+i]?'checked':''} onchange="db.checklist['${prefix+i}']=this.checked;save()"><span>${esc(x)}</span></label>`).join('')}
function review(){let s=stats();$('review').innerHTML=heading('review','Revisión final · día 15','Decidid si continuar, esperar o reformular sin arriesgar los 150 €.')+`<div class="grid">${summaryCard('Tareas completadas',s.done+' / '+s.total)}${summaryCard('Presupuesto disponible',eur(s.remaining))}${summaryCard('Proveedores contactados',db.providers.filter(x=>x.contact!=='Sin contactar').length)}</div><div class="card"><h3>Condiciones antes de gastar en producción</h3>${checks('review',['Identidad visual y público objetivo definidos','Al menos un diseño validado con compradores','Coste de camiseta base confirmado','Precio y técnica de estampación confirmados','Transporte y muestra presupuestados','Tallas, gramaje, corte y plazos comprobados','Escenarios de 5, 10 y 15 unidades calculados','Precio provisional con margen razonable y gastos adicionales considerados','Gasto autorizado por el equipo y dentro del presupuesto','Responsables y siguientes pasos acordados'])}</div><div class="card"><h3>Informe de cierre</h3><p>${s.done} tareas completadas, ${s.active} en curso, ${s.pending} pendientes. ${db.designs.filter(x=>x.status==='Aprobado').length} diseños aprobados. ${eur(s.paid)} pagados y ${eur(s.planned)} previstos. Bloqueos abiertos: ${db.decisions.filter(x=>x.type==='Bloqueo').length}.</p><button class="btn" onclick="window.print()">Imprimir informe</button><button class="btn alt" onclick="exportCSV('tasks')">Exportar tareas CSV</button></div>`}
function exportCSV(kind){let arr=db[kind],keys=schemas[kind].map(x=>x[0]);let quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let csv='\ufeff'+[keys.join(';'),...arr.map(r=>keys.map(k=>quote(r[k])).join(';'))].join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),kind+'.csv')}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportJSON(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'golden-century-backup.json')}
function importJSON(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.providers)||!Array.isArray(d.team)||!d.settings)throw Error('Formato no válido');if(confirm('¿Reemplazar los datos actuales por esta copia?')){db=d;save();alert('Copia importada')}}catch(e){alert('No se pudo importar: '+e.message)}};r.readAsText(f)}
function reset(mode){if(!confirm(mode==='demo'?'¿Restaurar datos iniciales? Se perderán los cambios actuales.':'¿Borrar todos los datos locales? Se perderá el trabajo guardado.'))return;db=mode==='demo'?structuredClone(SEED):{...structuredClone(SEED),tasks:[],providers:[],designs:[],expenses:[],contacts:[],meetings:[],posts:[],decisions:[]};save()}
function data(){$('data').innerHTML=heading('data','Datos y copias','Todo se guarda automáticamente en este navegador mediante localStorage. No existe sincronización entre dispositivos.')+`<div class="card"><h3>Configuración</h3><div class="formgrid"><div>${settingsField('start','Fecha de inicio de fase','date')}</div><div>${settingsField('budget','Límite de presupuesto (€)','number')}</div></div><p>Si compartís el proyecto entre tres personas, cada navegador tendrá sus propios datos. Exportad e importad copias para consolidar cambios; importar reemplaza el estado local.</p></div><div class="card"><h3>Copias y exportaciones</h3><div class="toolbar"><button class="btn" onclick="exportJSON()">Exportar copia JSON</button><label class="btn alt" style="cursor:pointer">Importar JSON <input style="display:none" type="file" accept="application/json,.json" onchange="importJSON(this)"></label>${Object.keys(schemas).map(k=>`<button class="btn alt" onclick="exportCSV('${k}')">CSV ${k}</button>`).join('')}</div></div><div class="card"><h3>Restaurar</h3><div class="toolbar"><button class="btn alt" onclick="reset('demo')">Restaurar datos iniciales</button><button class="btn danger" onclick="reset('clear')">Borrar datos locales</button></div><p>Las tareas iniciales son un plan propuesto, no tareas realizadas. Los proveedores son candidatos sin precios confirmados.</p></div>`}
function render(){dashboard();calendar();creative();providers();finance();pricing();team();marketing();meetings();review();data()}
render();nav('dashboard');
</script></body></html>
